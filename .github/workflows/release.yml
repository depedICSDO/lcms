name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ("${{ github.ref_name }}" -ne "v$packageVersion") {
            throw "Tag ${{ github.ref_name }} must match package.json version $packageVersion."
          }

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # No VITE_SUPABASE_* env needed — supabase.js falls back to the public
      # project URL/anon key baked in as defaults when these are unset.
      - name: Build Windows installer
        run: npm run dist -- --win nsis --publish never

      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

  publish-release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged installer
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
